function wireDrag(){const list=$('#list');if(!list)return;let drag=null,moved=false;
 list.querySelectorAll('[data-grip]').forEach(g=>{g.addEventListener('click',e=>e.stopPropagation());g.addEventListener('pointerdown',e=>{e.preventDefault();drag=g.closest('.ad');drag.classList.add('drag');g.setPointerCapture(e.pointerId);moved=false});
 g.addEventListener('pointermove',e=>{if(!drag)return;const over=[...list.children].find(el=>{const r=el.getBoundingClientRect();return el!==drag&&e.clientY>r.top&&e.clientY<r.bottom});
  if(over){const r=over.getBoundingClientRect();list.insertBefore(drag,e.clientY<r.top+r.height/2?over:over.nextSibling);moved=true}});
 const end=async()=>{if(!drag)return;drag.classList.remove('drag');drag=null;if(!moved)return;const ids=[...list.children].map(el=>el.dataset.id);
  const changes=ids.map((id,i)=>({id,i})).filter(({id,i})=>{const a=ads.find(x=>String(x.id)===id);return a&&a.sort_order!==i});

 g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end)});

  list.insertBefore(el,e.key==='ArrowUp'?sib:sib.nextSibling);g.focus();const ids=[...list.children].map(x=>x.dataset.id);for(const[i,id]of ids.entries()){const a=ads.find(x=>String(x.id)===id);if(a&&a.sort_order!==i){const{error}=await sb.from('ads').update({sort_order:i}).eq('id',id);if(error)return err(error)}}await loadAds()}))}

function statsView(){const t=totals(range),p={im:0,cl:0};const now=Date.now();const keys=new Set();for(let i=range;i<range*2;i++)keys.add(dayKey(new Date(now-i*864e5)));daily.forEach(r=>{if(keys.has(r.day)){p.im+=+r.impressions;p.cl+=+r.clicks}});
 const rows=ads.map(a=>({a,...totals(range,a.id)})).filter(x=>x.im||x.cl||x.a.status==='live').sort((x,y)=>y.im-x.im);
 return `${topBar('الإحصائيات','أرقام تقريبية لقياس التفاعل',`<span style="display:flex;gap:8px"><button class="icon" id="csv" aria-label="تصدير CSV">${ic('down',18)}</button>${can('view')?'':`<button class="icon" id="menuBtn" aria-label="القائمة">${ic('more',18)}</button>`}</span>`)}
 <div class="seg" role="group">${[[1,'اليوم'],[7,'7 أيام'],[30,'30 يوم']].map(([d,l])=>`<button data-range="${d}" aria-pressed="${range===d}">${l}</button>`).join('')}</div>
 <div class="kpis">${kpi('eye','الظهور',fmt(t.im),range<30?delta(t.im,p.im):'')}${kpi('tap','الضغطات',fmt(t.cl),range<30?delta(t.cl,p.cl):'')}</div>
 <div class="card"><h2>الضغطات يومياً</h2>${bars(series(range===1?7:range,'clicks'))}</div>
 <div class="card" style="padding:14px"><table><thead><tr><th>الإعلان</th><th>ظهور</th><th>ضغط</th><th>النسبة</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.a.title)}</b></td><td class="num">${fmt(x.im)}</td><td class="num">${fmt(x.cl)}</td><td class="num" style="font-weight:700;color:${x.im&&x.cl/x.im>.025?'var(--ok)':'var(--sub)'}">${x.im?(x.cl/x.im*100).toFixed(1):'0.0'}%</td></tr>`).join(''):'<tr><td colspan="4" class="muted">لا توجد بيانات لهذه الفترة</td></tr>'}</tbody></table></div>
 <div class="sub" style="display:flex;gap:10px;align-items:flex-start;padding:0 4px">${ic('shield',16)}<span>الظهور أو الضغط المكرر من نفس المصدر خلال دقيقة يُحسب مرة واحدة. لا معرّفات ولا مواقع. التنزيلات نفسها تتم في Google Play ولا تظهر هنا.</span></div>`}
function exportCsv(){const lines=[['اليوم','الإعلان','الظهور','الضغطات']];const name=id=>(ads.find(a=>String(a.id)===String(id))||{}).title||id;
 daily.slice().sort((a,b)=>a.day<b.day?-1:1).forEach(r=>lines.push([r.day,name(r.ad_id),r.impressions,r.clicks]));
 const csv='﻿'+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`keyvo-stats-${dayKey(new Date())}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

// ---------- members ----------
function ago(t){if(!t)return'لم يدخل بعد';const m=(Date.now()-Date.parse(t))/6e4;return m<5?'متصل الآن':m<60?`قبل ${Math.round(m)} دقيقة`:m<1440?`قبل ${Math.round(m/60)} ساعة`:`قبل ${Math.round(m/1440)} يوم`}
const ACT={'member.invited':['دعا','var(--acc)'],'member.joined':['فعّل حسابه','var(--ok)'],'member.suspended':['أوقف','var(--off)'],'member.activated':['أعاد تفعيل','var(--ok)'],'member.changed':['غيّر دور','var(--acc)'],'member.removed':['حذف','var(--bad)'],'member.reinvited':['أعاد دعوة','var(--acc)'],
 'ad.live':['نشر','var(--ok)'],'ad.pending':['أرسل للموافقة','var(--warn)'],'ad.draft':['حفظ مسودة','var(--accInk)'],'ad.paused':['أوقف','var(--off)'],'ad.edited':['عدّل','var(--acc)'],'ad.deleted':['حذف','var(--bad)']};
function membersView(){const count=r=>members.filter(m=>m.role===r).length;
 return `${topBar('المشرفون','الأدوار تحدد ما يراه كل مشرف',`<span style="display:flex;gap:8px"><button class="pill" data-go="invite">${ic('plus',18)}إضافة مشرف</button>${can('view')||can('stats')?'':`<button class="icon" id="menuBtn" aria-label="القائمة">${ic('more',18)}</button>`}</span>`)}
 <div class="roles">${['manager','editor','analyst'].map(r=>`<div>${ri(r,36)}<span>${ROLES[r].n}</span><b class="num">${count(r)}</b></div>`).join('')}</div>
 <div class="card" style="padding:4px 14px;gap:0">${members.map(m=>{const pend=!m.user_id;const st=!m.active?['موقوف','c-off']:pend?['بانتظار التفعيل','c-pending']:['نشط','c-live'];
  return `<div class="member">${ri(m.role)}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="display:flex;align-items:center;gap:8px"><b class="ellipsis">${esc(m.name||m.email.split('@')[0])}${m.user_id&&m.email===me.email?' (أنت)':''}</b><span class="chip ${st[1]}">${st[0]}</span></span><span class="muted">${ROLES[m.role].n}${m.is_owner?' · المالك':''}</span><span class="sub num ellipsis" dir="ltr" style="text-align:right">${esc(m.email)} · ${ago(m.last_seen)}</span></span>
  ${m.is_owner||m.email===me.email?'':`<button class="icon" style="border:0;background:none" data-member="${esc(m.email)}" aria-label="خيارات ${esc(m.email)}">${ic('more')}</button>`}</div>`}).join('')}</div>
 <div class="card"><h2>سجل التغييرات</h2>${audit.length?audit.map(l=>{const[a,c]=ACT[l.action]||[l.action,'var(--mute)'];return `<div class="log"><i style="background:${c}"></i><span style="flex:1;min-width:0" class="ellipsis">${esc(l.actor_name||'النظام')} ${a} «${esc(l.target||'')}»</span><span class="sub">${ago(l.at).replace('متصل الآن','الآن')}</span></div>`}).join(''):'<span class="muted">لا توجد تغييرات بعد</span>'}</div>`}
let inv={role:'editor',perms:['view','edit','stats'],code:null,email:'',name:''};
function inviteView(){if(inv.code)return `${backbar('الدعوة جاهزة')}<div class="card"><span class="muted">أرسل هذا الرمز إلى <b dir="ltr" class="num">${esc(inv.email)}</b> بطريقة خاصة (واتساب أو رسالة). صالح 7 أيام ولمرة واحدة.</span><div class="code" id="code">${esc(inv.code)}</div>
 <div class="row"><button class="btn primary" id="shareCode">${ic('share',18)}مشاركة</button><button class="btn" id="copyCode">${ic('copy',18)}نسخ</button></div><span class="sub">يفتح اللوحة ويضغط «عندك رمز دعوة؟» ثم يكتب بريده وكلمة مرور يختارها والرمز.</span></div><button class="btn" data-go="members">تم</button>`;
 const perms=inv.role==='custom'?inv.perms:ROLE_PERMS[inv.role];
 return `${backbar('إضافة مشرف')}<form id="invForm" class="card"><label class="f">البريد الإلكتروني<span class="in">${ic('mail',18)}<input name="email" type="email" dir="ltr" required placeholder="name@example.com" value="${esc(inv.email)}"></span></label><label class="f">الاسم (اختياري)<span class="in"><input name="name" maxlength="60" value="${esc(inv.name)}"></span></label><span class="sub">يصله رمز دعوة منك ليفعّل حسابه بنفسه.</span></form>
 <h2 style="padding:0 4px">الدور</h2><div role="radiogroup" aria-label="الدور" style="display:flex;flex-direction:column;gap:8px">${Object.entries(ROLES).map(([k,R])=>`<button type="button" class="opt" role="radio" aria-checked="${inv.role===k}" data-role="${k}">${ri(k,40)}<span style="flex:1;display:flex;flex-direction:column;gap:2px"><b>${R.n}</b><span class="muted">${R.d}</span></span><span class="dot"></span></button>`).join('')}</div>
 <div class="card" style="gap:4px"><b>صلاحيات «${ROLES[inv.role].n}»</b><span class="sub">غيّر أي مفتاح ويتحول الدور إلى «مخصص».</span>${PERMS.map(([p,l])=>`<div class="perm"><span style="color:${perms.includes(p)?'var(--ink)':'var(--mute)'}">${l}</span><button class="tg" role="switch" aria-label="${l}" aria-checked="${perms.includes(p)}" data-perm="${p}"></button></div>`).join('')}
 <div class="perm"><span style="color:${inv.role==='manager'?'var(--ink)':'var(--mute)'}">إدارة المشرفين</span><button class="tg" role="switch" aria-label="إدارة المشرفين" aria-checked="${inv.role==='manager'}" disabled></button></div><span class="sub">إدارة المشرفين للمدير العام فقط.</span></div>
 <button class="btn primary" id="sendInvite">${ic('mail',18)}إنشاء الدعوة</button>`}
function keepInv(){const f=$('#invForm');if(f){inv.email=f.email.value;inv.name=f.name.value}}
function memberMenu(email){const m=members.find(x=>x.email===email);if(!m)return;
 const opts=[...Object.keys(ROLES).filter(r=>r!==m.role&&r!=='custom').map(r=>[`role:${r}`,`تغيير الدور إلى «${ROLES[r].n}»`]),[m.active?'off':'on',m.active?'إيقاف الحساب':'إعادة التفعيل'],['re','رمز دعوة جديد'],['rm','حذف المشرف']];
 const el=document.createElement('div');el.className='menu';el.innerHTML=`<div class="sheet" role="dialog" aria-label="خيارات"><b style="padding:0 4px 6px">${esc(m.name||m.email)}</b>${opts.map(([k,l])=>`<button class="btn ${k==='rm'?'danger':''}" data-k="${k}">${esc(l)}</button>`).join('')}<button class="btn" data-k="x">إلغاء</button></div>`;
 document.body.appendChild(el);el.onclick=async e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(e.target===el||k==='x')return el.remove();if(!k)return;el.remove();
  try{if(k.startsWith('role:')){const{error}=await sb.rpc('panel_update_member',{p_email:email,p_role:k.slice(5)});if(error)throw error;toast('تم تغيير الدور')}
   else if(k==='off'||k==='on'){const{error}=await sb.rpc('panel_update_member',{p_email:email,p_active:k==='on'});if(error)throw error;toast(k==='on'?'أُعيد التفعيل':'أوقف الحساب')}
   else if(k==='re'){const{data,error}=await sb.rpc('panel_reinvite',{p_email:email});if(error)throw error;inv={...inv,code:data,email};await loadMembers();return go('invite')}
   else if(k==='rm'){if(!confirm(`حذف ${email} من المشرفين؟`))return;const{error}=await sb.rpc('panel_remove_member',{p_email:email});if(error)throw error;toast('حُذف')}
   await loadMembers();render()}catch(x){err(x)}}}

// ---------- shell ----------
function navView(){const items=[['home','الرئيسية','home',can('view')],['ads','الإعلانات','ads',can('view')],['stats','الإحصائيات','chart',can('stats')],['members','المشرفون','users',can('members')]].filter(x=>x[3]);
 return items.length>1?items.map(([r,l,i])=>`<button data-go="${r}" ${route===r||(route==='edit'&&r==='ads')||(route==='invite'&&r==='members')?'aria-current="page"':''}><span>${ic(i)}</span>${l}</button>`).join(''):''}
function show(r,p){route=r;param=p;render();scrollTo(0,0)}
function go(r,p){if(r==='edit'){file=null;draft=p==='new'?{status:'draft',cta:'تحميل',interval_seconds:6}:{...ads.find(a=>String(a.id)===String(p))};if(!draft)return}
 if(r==='invite'&&route!=='invite')inv={role:'editor',perms:['view','edit','stats'],code:null,email:'',name:''};show(r,p)}
function render(){const views={login:loginView,activate:activateView,join:joinView,home:homeView,ads:adsView,edit:editorView,stats:statsView,members:membersView,invite:inviteView};
 app.innerHTML=(views[route]||homeView)();const nav=$('#nav');const n=me&&!['login','activate','join'].includes(route)?navView():'';nav.innerHTML=n;nav.classList.toggle('hidden',!n);
 if(route==='ads')wireDrag();if(route==='edit')wireEditor();wireForms()}
function wireForms(){
 const lf=$('#loginForm');if(lf)lf.onsubmit=async e=>{e.preventDefault();const b=lf.querySelector('button[type=submit]');b.disabled=true;const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});b.disabled=false;if(error)return err(error);boot()};
 const fg=$('#forgot');if(fg)fg.onclick=async()=>{const e=$('#email').value.trim();if(!e)return toast('اكتب بريدك أولاً');const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});toast(error?'تعذّر الإرسال. اطلب من المدير رمز دعوة جديد.':'إن كان البريد مسجلاً فستصله رسالة لإعادة التعيين.')};
 const af=$('#actForm');if(af)af.onsubmit=async e=>{e.preventDefault();const b=af.querySelector('button[type=submit]');b.disabled=true;
  try{const email=$('#aemail').value.trim(),password=$('#apass').value,code=$('#acode').value.trim().toUpperCase();
   let r=await sb.auth.signUp({email,password});if(r.error&&/already|registered/i.test(r.error.message))r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;
   if(!r.data.session){toast('أكّد بريدك من الرسالة التي وصلتك، ثم ادخل واكتب الرمز.');return show('login')}
   const{error}=await sb.rpc('panel_join',{code});if(error)throw error;toast('تم التفعيل ✓');boot()}catch(x){err(x)}finally{b.disabled=false}};
 const jf=$('#joinForm');if(jf)jf.onsubmit=async e=>{e.preventDefault();const{error}=await sb.rpc('panel_join',{code:$('#jcode').value.trim().toUpperCase()});if(error)return err(error);boot()};
 const lo=$('#logout');if(lo)lo.onclick=async()=>{await sb.auth.signOut();me=null;show('login')};
 const mb=$('#menuBtn');if(mb)mb.onclick=()=>{const el=document.createElement('div');el.className='menu';const light=document.documentElement.dataset.theme==='light';
  el.innerHTML=`<div class="sheet" role="dialog" aria-label="القائمة"><b style="padding:0 4px 6px" dir="ltr" class="num">${esc(me.email)}</b><button class="btn" data-k="theme">${ic('moon',18)}${light?'الوضع الداكن':'الوضع الفاتح'}</button><button class="btn" data-k="pass">${ic('lock',18)}تغيير كلمة المرور</button><button class="btn" data-k="out">${ic('out',18)}خروج</button><button class="btn" data-k="x">إلغاء</button></div>`;
  document.body.appendChild(el);el.onclick=async e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(e.target!==el&&!k)return;el.remove();
   if(k==='theme'){theme(light?'dark':'light')}else if(k==='out'){await sb.auth.signOut();me=null;show('login')}
   else if(k==='pass'){const p=prompt('كلمة المرور الجديدة (8 أحرف على الأقل)');if(!p)return;if(p.length<8)return toast('قصيرة جداً');const{error}=await sb.auth.updateUser({password:p});toast(error?'تعذّر: '+error.message:'تم تغيير كلمة المرور')}}};
 const csv=$('#csv');if(csv)csv.onclick=exportCsv;
 const si=$('#sendInvite');if(si)si.onclick=async()=>{keepInv();const f=$('#invForm');if(!f.reportValidity())return;si.disabled=true;
  const perms=inv.role==='custom'?inv.perms:[];const{data,error}=await sb.rpc('panel_invite',{p_email:inv.email.trim(),p_name:inv.name.trim(),p_role:inv.role,p_perms:perms});si.disabled=false;if(error)return err(error);inv.code=data;await loadMembers();render()};
 const sc=$('#shareCode');if(sc){const msg=`دعوة للانضمام إلى لوحة إدارة Keyvo\nالرابط: ${location.href.split('#')[0]}\nالبريد: ${inv.email}\nرمز الدعوة: ${inv.code}`;
  sc.onclick=async()=>{if(navigator.share)try{await navigator.share({text:msg})}catch(_){}else{await navigator.clipboard.writeText(msg);toast('نُسخت الرسالة')}};
  $('#copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(inv.code);toast('نُسخ الرمز')}catch(_){toast(inv.code)}}}
}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-edit],[data-filter],[data-toggle],[data-range],[data-role],[data-perm],[data-member]');if(!t)return;
 if(t.dataset.toggle){e.stopPropagation();const a=ads.find(x=>String(x.id)===t.dataset.toggle);const next=a.status==='live'?'paused':'live';t.disabled=true;
  const{error}=await sb.from('ads').update({status:next}).eq('id',a.id);if(error){err(error);t.disabled=false;return}toast(next==='live'?'شُغّل':'أوقف');await loadAds();return render()}
 if(t.dataset.go)return go(t.dataset.go);if(t.dataset.edit)return go('edit',t.dataset.edit);
 if(t.dataset.filter){filter=t.dataset.filter;return render()}if(t.dataset.range){range=+t.dataset.range;return render()}
 if(t.dataset.role){keepInv();inv.role=t.dataset.role;if(inv.role==='custom'&&!inv.perms.length)inv.perms=['view'];return render()}
 if(t.dataset.perm){keepInv();const cur=inv.role==='custom'?inv.perms:ROLE_PERMS[inv.role].filter(p=>p!=='members');const p=t.dataset.perm;inv.perms=cur.includes(p)?cur.filter(x=>x!==p):[...cur,p];inv.role='custom';return render()}
 if(t.dataset.member)return memberMenu(t.dataset.member)});
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){setTimeout(async()=>{const p=prompt('اختر كلمة مرور جديدة (8 أحرف على الأقل)');if(p&&p.length>=8){const{error}=await sb.auth.updateUser({password:p});toast(error?'تعذّر: '+error.message:'تم ✓');boot()}},300)}});
boot().catch(e=>{err(e);show('login')});
</script>
</body>
